# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- main

pool:
  name: 'MyPool'

variables:
  solution: '$(System.DefaultWorkingDirectory)\StaffingPortalBackend.csproj'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '$(System.DefaultWorkingDirectory)\StaffingPortalBackend.csproj'
    feedsToUse: 'select'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(System.DefaultWorkingDirectory)\StaffingPortalBackend.csproj'

- task: DotNetCoreCLI@2
  inputs:
    command: 'custom'
    custom: 'ef database update'

- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '-o $(System.DefaultWorkingDirectory)\publish'

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)'
    Contents: 'staffdb.db'
    TargetFolder: '$(System.DefaultWorkingDirectory)\publish'

- task: AzureRmWebAppDeployment@4
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'Azure subscription 1(e4861d0a-8abf-4732-9d14-53435d54dcf6)'
    appType: 'webAppLinux'
    WebAppName: 'staffportalbackend'
    packageForLinux: '$(System.DefaultWorkingDirectory)/publish/*.zip'
    RuntimeStack: 'DOTNETCORE|6.0'